# Exported & Hardened for StudioFlow on 2026-06-19
# Implements Graceful Rollouts and Zero-Downtime routing for Render
version: "1"
services:
  - type: web
    name: studioflow-dashboard
    runtime: node
    repo: https://github.com/madoyakimberley/studioflow
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pnpm install && pnpm build --filter client-dashboard
    startCommand: cd apps/client-dashboard && pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: UPLOADTHING_APP_ID
        sync: false
      - key: UPLOADTHING_SECRET
        sync: false
      - key: RENDER_OWNER_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: NEXT_PUBLIC_ADMIN_EMAILS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TARGET_OUTPUT_DIR
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: studioflow-api
    runtime: python
    repo: https://github.com/madoyakimberley/studioflow
    plan: free
    region: oregon
    rootDir: apps/api-core
    buildCommand: pip install -r requirements.txt
    # Explicitly using the requested Gunicorn configuration for Uvicorn worker routing
    startCommand: python -m gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: RENDER_OWNER_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: NEXT_PUBLIC_ADMIN_EMAILS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TARGET_OUTPUT_DIR
        sync: false
      - key: DATABASE_URL
        sync: false
