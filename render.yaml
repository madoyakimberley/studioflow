services:
  # 1. The Next.js Client Dashboard
  - type: web
    name: studioflow-dashboard
    env: node
    plan: free
    autoDeploy: true
    buildCommand: pnpm install && pnpm build --filter client-dashboard
    startCommand: cd apps/client-dashboard && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: PNPM_VERSION
        value: 9.x
      - key: API_BASE_URL
        fromService:
          type: web
          name: studioflow-api
          property: host

  # 2. The Python FastAPI Core Engine
  - type: web
    name: studioflow-api
    env: python
    plan: free
    autoDeploy: true
    rootDir: apps/api-core
    # We install gunicorn here so the system has the application server ready
    buildCommand: pip install uv && uv pip install --system -r requirements.txt && pip install gunicorn
    # We use Gunicorn to manage the Uvicorn worker. This bypasses the pathing issues.
    startCommand: gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
