name: StudioFlow Production Deployment

on:
  push:
    branches:
      - main

jobs:
  trigger-render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Client Dashboard Build
        # You generate this URL in the Render Dashboard -> Settings -> Deploy Hook
        run: curl -X POST ${{ secrets.RENDER_DASHBOARD_HOOK }}

      - name: Trigger Python API Build
        # You generate this URL in the Render Dashboard -> Settings -> Deploy Hook
        run: curl -X POST ${{ secrets.RENDER_API_HOOK }}
